name: Check campaign manager
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test
      - run: npm run test:rules
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: campaign-manager-build
          path: dist/
          retention-days: 7
